<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MChicken Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/pages/index/index.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components/sidePanel.css">
    <link rel="stylesheet" href="../css/components/sidePaneloptionsElementActive.css">
    <link rel="stylesheet" href="../css/components/mainPage.css">
    <link rel="stylesheet" href="../css/components/consoleComponents.css">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">  <!-- Added font for console output -->
    <script src="../js/main.js" defer></script>
    <script src="../js/index.js" defer></script>
</head>
<body class="mainPageBody"> 
    <div id="sidePanel">
        <div id="sidePanelSiteDataItem">
            <i class="fa-solid fa-gamepad" style="color: var(--accent-primary); font-size: 20pt;"></i>
            <span><b>MChicken Panel</b></span>
        </div>
        <hr id="sidePanelHrTop" class="hrSplitter">
        <div id="sidePanelOptionsItem">
            <ul id="sidePanelOptionsList">
                <li id="dashboardButton" class="sidePanelOptionsListElement sidePanelOptionsListElementActive"><i class="fa-solid fa-gauge sidePanelIconActive" style="color: var(--text-color); font-size: 16pt;"></i><span><b>Dashboard</b></span></li>
                <li id="consoleButton" class="sidePanelOptionsListElement"><i class="fa-solid fa-terminal" style="color: var(--text-color); font-size: 16pt;"></i><span><b>Console</b></span></li>
                <li id="backupsButton" class="sidePanelOptionsListElement"><i class="fa-solid fa-box-archive" style="color: var(--text-color); font-size: 16pt;"></i><span><b>Backups</b></span></li>
                <li id="settingsButton" class="sidePanelOptionsListElement"><i class="fa-solid fa-gear" style="color: var(--text-color); font-size: 16pt;"></i><span><b>Settings</b></span></li>
            </ul>
        </div>
        <div class="sidePanelUserItem">
            <i class="fa-solid fa-circle-user fa-xl " style="color: var(--accent-primary); font-size: 18pt;"></i>
            <span style="margin-right: auto">Username</span>
            <i class="fa-solid fa-right-from-bracket fa-lg" id="logoutButton" style="color: var(--status-danger);"></i>
        </div>
    </div>  

    <div class="mainPage">
        <div id="mainPageContentServerManager">
            <div id="serverInfo" class="serverInfoHidden">
                <div id="serverInfoHeader">
                    <span id="serverInfoHeaderName"></span><div id="serverInfoHeaderStatus"> <i class="fa-solid fa-circle fa-xs" id="serverStatusIcon"></i> <span id="serverStatus"></span></div>
                </div>
                <div id="serverInfoContent">
                    <span id="serverVersion"></span>
                    <span> / </span>
                    <span id="serverIp"></span>
                </div>
            </div>
            <div id="serverManagerButtons">
                <div class="serverManagerButton" id="buttonStartStop"><i id="buttonStartStopIcon" class="fa-solid fa-play"></i><span id="buttonStartStopSpan">Start</span></div>
                <div class="serverManagerButton" id="buttonRestart" ><i class="fa-solid fa-rotate-left"></i><span>Restart</span></div>
                <div class="serverManagerButton" id="buttonBackup"><i class="fa-solid fa-save"></i><span>Backup</span></div>
            </div>
        </div>
        <div id="mainPageContentServerStats">
            <div class="serverStat">
                <div class="serverStatName"><i class="fa-solid fa-users"></i><span>Players</span></div>
                <hr class="hrSplitter" style="margin: 7.5pt 0pt;">
                <div class="serverStatValue" id="serverStatPlayers"></div>
            </div>
            <div class="serverStat">
                <div class="serverStatName"><i class="fa-solid fa-microchip"></i><span>CPU Usage</span></div>
                <hr class="hrSplitter" style="margin: 7.5pt 0pt;">
                <div class="serverStatValue" id="serverStatCPUUsage"></div>
            </div>
            <div class="serverStat">
                <div class="serverStatName"><i class="fa-solid fa-memory"></i><span>RAM Usage</span></div>
                <hr class="hrSplitter" style="margin: 7.5pt 0pt;">
                <div class="serverStatValue" id="serverStatMemUsage"></div>
            </div>
            <div class="serverStat">
                <div class="serverStatName"><i class="fa-solid fa-hdd"></i><span>MAX Ram</span></div>
                <hr class="hrSplitter" style="margin: 7.5pt 0pt;">
                <div class="serverStatValue" id="serverStatMaxMem"></div>
            </div>
            <div class="serverStat">
                <div class="serverStatName"><i class="fa-solid fa-clock"></i><span>Uptime</span></div>
                <hr class="hrSplitter" style="margin: 7.5pt 0pt;">
                <div class="serverStatValue" id="serverStatUptime"></div>
            </div>
            <div class="serverStat">
                <div class="serverStatName"><i class="fa-solid fa-save"></i><span>Last Backup</span></div>
                <hr class="hrSplitter" style="margin: 7.5pt 0pt;">
                <div class="serverStatValue">Never</div>
            </div>
        </div>
        <div id="mainPageContentConsole">
            <div id="consoleHeader"><i class="fa-solid fa-terminal"></i><span>Console</span><i id="consoleExpandButton" class="fa-solid fa-arrow-up-right-from-square"></i></div>
            <div id="consoleTerminal">
                <textarea id="consoleTerminalOutput" class="consoleOutput"readonly></textarea>
            </div>
            <div id="consoleInput">
                <i class="fa-solid fa-angles-right"></i>
                <input type="text" id="consoleInputField" placeholder="Type a command...">
                <i class="fa-solid fa-paper-plane"></i>
            </div>
        </div>
    </div>
    
</body>
</html>
