<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MChicken Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components/sidePanel.css">
    <link rel="stylesheet" href="../css/components/sidePaneloptionsElementActive.css">
    <link rel="stylesheet" href="../css/components/mainPage.css">
    <link rel="stylesheet" href="../css/pages/console/console.css">
    <link rel="stylesheet" href="../css/components/consoleComponents.css">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">  <!-- Added font for console output -->
    <script src="../js/main.js" defer></script>
</head>
<body class="mainPageBody"> 
    <div id="sidePanel">
        <div id="sidePanelSiteDataItem">
            <i class="fa-solid fa-gamepad" style="color: var(--accent-primary); font-size: 20pt;"></i>
            <span><b>MChicken Panel</b></span>
        </div>
        <hr id="sidePanelHrTop" class="hrSplitter">
        <div id="sidePanelOptionsItem">
            <ul id="sidePanelOptionsList">
                <li id="dashboardButton" class="sidePanelOptionsListElement"><i class="fa-solid fa-gauge" style="color: var(--text-color); font-size: 16pt;"></i><span><b>Dashboard</b></span></li>
                <li id="consoleButton" class="sidePanelOptionsListElement sidePanelOptionsListElementActive"><i class="fa-solid fa-terminal sidePanelIconActive" style="color: var(--text-color); font-size: 16pt;"></i><span><b>Console</b></span></li>
                <li id="backupsButton" class="sidePanelOptionsListElement"><i class="fa-solid fa-box-archive" style="color: var(--text-color); font-size: 16pt;"></i><span><b>Backups</b></span></li>
                <li id="settingsButton" class="sidePanelOptionsListElement"><i class="fa-solid fa-gear" style="color: var(--text-color); font-size: 16pt;"></i><span><b>Settings</b></span></li>
            </ul>
        </div>
        <div class="sidePanelUserItem">
            <i class="fa-solid fa-circle-user fa-xl " style="color: var(--accent-primary); font-size: 18pt;"></i>
            <span style="margin-right: auto">Username</span>
            <i class="fa-solid fa-right-from-bracket fa-lg" id="logoutButton" style="color: var(--status-danger);"></i>
        </div>
    </div>  

    <div id="consolePageConsole">
        <div id="consoleHeader"><i class="fa-solid fa-terminal"></i><span>Console</span><i id="consoleExpandButton" class="fa-solid fa-angles-left fa-rotate-by consoleIconRotate"></i></div>
        <div id="consoleTerminal">
            <textarea id="consoleTerminalOutput" class="consoleOutput"readonly></textarea>
        </div>
        <div id="consoleInput">
            <i class="fa-solid fa-angles-right"></i>
            <input type="text" id="consoleInputField" placeholder="Type a command...">
            <i class="fa-solid fa-paper-plane"></i>
        </div>
    </div>
    
</body>
</html>
