<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MChicken Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/pages/index/index.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/components/sidePanel.css">
    <link rel="stylesheet" href="../css/components/sidePaneloptionsElementActive.css">
    <link rel="stylesheet" href="../css/components/mainPage.css">
    <link rel="stylesheet" href="../css/components/consoleComponents.css">
    <link rel="stylesheet" href="../css/pages/settings/settings.css">
    <link rel="stylesheet" href="../css/components/input.css">
    <script src="../js/main.js" defer></script>
</head>
<body class="mainPageBody"> 
    <div id="sidePanel">
        <div id="sidePanelSiteDataItem">
            <i class="fa-solid fa-gamepad" style="color: var(--accent-primary); font-size: 20pt;"></i>
            <span><b>MChicken Panel</b></span>
        </div>
        <hr id="sidePanelHrTop" class="hrSplitter">
        <div id="sidePanelOptionsItem">
            <ul id="sidePanelOptionsList">
                <li id="dashboardButton" class="sidePanelOptionsListElement"><i class="fa-solid fa-gauge" style="color: var(--text-color); font-size: 16pt;"></i><span><b>Dashboard</b></span></li>
                <li id="consoleButton" class="sidePanelOptionsListElement"><i class="fa-solid fa-terminal" style="color: var(--text-color); font-size: 16pt;"></i><span><b>Console</b></span></li>
                <li id="backupsButton" class="sidePanelOptionsListElement"><i class="fa-solid fa-box-archive" style="color: var(--text-color); font-size: 16pt;"></i><span><b>Backups</b></span></li>
                <li id="settingsButton" class="sidePanelOptionsListElement sidePanelOptionsListElementActive"><i class="fa-solid fa-gear sidePanelIconActive" style="color: var(--text-color); font-size: 16pt;"></i><span><b>Settings</b></span></li>
            </ul>
        </div>
        <div class="sidePanelUserItem">
            <i class="fa-solid fa-circle-user fa-xl " style="color: var(--accent-primary); font-size: 18pt;"></i>
            <span style="margin-right: auto">Username</span>
            <i class="fa-solid fa-right-from-bracket fa-lg" id="logoutButton" style="color: var(--status-danger);"></i>
        </div>
    </div>  

    <div class="mainPage">
        <div class="pageHeader">
            <span class="pageHeaderTitle">Settings</span>
            <span class="pageHeaderSubtitle">Here you can manage your panel settings.</span>
        </div>
        <div class="settingsContent">
            <div class="settingsTab">
                <div class="settingsTabTitle">Server Setup <hr class="hrSplitter" style="width: 100% !important;"></div>
                <div class="serverSetupTabs">
                    <div class="serverSetupTab">
                        <span class="serverSetupTabSubtitle">SSH IP / PORT</span>
                        <div id="sshIpPort">
                            <input placeholder="x.x.x.x" class="mainInputStyle" style="width: 100pt;"> 
                            <input placeholder="22" class="mainInputStyle" style="width: 50pt;">
                        </div>
                        <span class="serverSetupTabSubtitle">Username</span>
                        <input placeholder="root" class="mainInputStyle">
                        <span class="serverSetupTabSubtitle">Password</span>
                        <input placeholder="password" type="password" class="mainInputStyle">
                        <span id="serverSetupTabSSHSubmit">Submit</span>
                    </div>
                    <div class="serverSetupTab">
                        server
                    </div>
                </div>
            </div>

            <div class="settingsTab">
                <div class="settingsTabTitle">Users <hr class="hrSplitter" style="width: 100% !important;"></div>
                <div>2</div>
            </div>

        </div>

    </div>
    
</body>
</html>
